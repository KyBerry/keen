name: security

on:
  schedule:
    - cron: "0 6 * * 1"   # Mon 06:00 UTC
  pull_request:
    paths:
      - "plugins/keen/pyproject.toml"
      - "plugins/keen/requirements.lock"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/keen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock --strict
