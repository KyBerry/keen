name: security

on:
  schedule:
    - cron: "0 6 * * 1"   # Mon 06:00 UTC
  pull_request:
    paths:
      - "plugins/keen/pyproject.toml"
      - "plugins/keen/requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/keen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install "pip-audit==2.10.1"
      - run: pip-audit -r requirements.lock --strict --disable-pip
